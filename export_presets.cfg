html/head_include="<style>#latido{position:fixed;display:none;transform:translateY(-50%);z-index:10;pointer-events:none;--lado:6px;gap:calc(var(--lado)*.6);align-items:center}body.cargando #latido{display:flex}#latido i{width:var(--lado);height:var(--lado);background:#d8b468;animation:latido .9s ease-in-out infinite;will-change:transform,opacity}#latido i:nth-child(2){animation-delay:.15s}#latido i:nth-child(3){animation-delay:.3s}@keyframes latido{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1);opacity:1}}</style><script>addEventListener('DOMContentLoaded',()=>{const d=document.createElement('div');d.id='latido';d.innerHTML='<i></i><i></i><i></i>';document.body.appendChild(d)});window.ubicarLatido=(x,y,lado)=>{const c=document.querySelector('canvas'),d=document.getElementById('latido');if(!c||!d)return;const r=c.getBoundingClientRect(),k=r.width/c.width;d.style.left=(r.left+x*k)+'px';d.style.top=(r.top+y*k)+'px';d.style.setProperty('--lado',(lado*k)+'px')}</script>"

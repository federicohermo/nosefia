name: verify

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-particion:
    name: Partición ${{ matrix.particion }} · ${{ matrix.tema }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - particion: 0
            tema: Cajas y agarre
          - particion: 1
            tema: Reposición y puestos
          - particion: 2
            tema: Apoyos y cierre
          - particion: 3
            tema: Arrastre y colisiones
          - particion: 4
            tema: Giro y balde
          - particion: 5
            tema: Limpieza y validaciones
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Identificar motor publicado
        id: motor
        run: |
          set -euo pipefail
          python .github/scripts/descargar_godot_nativo.py identidad \
            --plataforma linux-x86_64 > "$RUNNER_TEMP/motor-identidad.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          datos = json.loads((Path(os.environ['RUNNER_TEMP']) / 'motor-identidad.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as salida:
              salida.write(f"receta={datos['receta_sha256']}\n")
              salida.write(f"archivo={datos['archivo_sha256']}\n")
          PY

      - name: Restaurar motor publicado
        id: restaurar-motor
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/godot-native/linux-x86_64
          key: godot-publicado-linux-x86_64-${{ steps.motor.outputs.archivo }}

      - name: Descargar y validar motor publicado
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python .github/scripts/descargar_godot_nativo.py descargar \
            --plataforma linux-x86_64 --destino build/godot-native/linux-x86_64 \
            > "$RUNNER_TEMP/motor-nativo.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          datos = json.loads((Path(os.environ['RUNNER_TEMP']) / 'motor-nativo.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as salida:
              salida.write(f"GODOT_BIN={datos['binario']}\n")
              salida.write(f"GODOT_NATIVE_RECIPE={datos['receta_sha256']}\n")
          PY

      - name: Guardar motor publicado
        if: matrix.particion == 0 && steps.restaurar-motor.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/godot-native/linux-x86_64
          key: godot-publicado-linux-x86_64-${{ steps.motor.outputs.archivo }}

      - name: Identidad de las importaciones actuales
        id: importaciones
        run: python .github/scripts/cache_importaciones.py identidad

      - name: Restaurar importaciones compatibles
        id: restaurar-importaciones
        if: steps.importaciones.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: ${{ steps.importaciones.outputs.key }}

      - name: Preparar importaciones para la verificación actual
        env:
          CACHE_HIT: ${{ steps.restaurar-importaciones.outputs.cache-hit }}
          CACHE_RESULTADO: ${{ steps.restaurar-importaciones.outcome }}
          CACHE_CLAVE_RESTAURADA: ${{ steps.restaurar-importaciones.outputs.cache-matched-key }}
        run: python .github/scripts/cache_importaciones.py preparar

      - run: pip install "gdtoolkit==4.*"

      - name: verificar
        run: >-
          python .claude/scripts/verificar.py
          --particion-tests ${{ matrix.particion }}/${{ strategy.job-total }}

      - name: Registrar recursos derivados actuales
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          git ls-files -z 'assets/models/*.res' | xargs -0 -r sha256sum > reports/cache-recursos.sha256

      - name: Guardar importaciones para próximas revisiones
        if: >-
          success() && matrix.particion == 0 &&
          steps.importaciones.outputs.cacheable == 'true' &&
          steps.restaurar-importaciones.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.importaciones.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-gdunit4-${{ matrix.particion }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: verify-particion
    runs-on: ubuntu-latest
    steps:
      - name: Todas las particiones deben pasar
        env:
          RESULTADO: ${{ needs.verify-particion.result }}
        run: test "$RESULTADO" = success

# El nodo de convergencia, corrido por la máquina y no por la memoria de quien commitea.
#
# Corre `verificar.py` en particiones y NO enumera sus nodos como pasos separados. No es pereza:
# enumerarlos acá crearía un segundo lugar donde vive la lista, y el día que alguien agregue un
# nodo al script, la CI seguiría corriendo la lista vieja — en verde, que es exactamente el
# modo de falla que este workflow existe para cerrar.
#
# Lo que este workflow NO hace, a propósito:
#
#   - No exporta el juego para publicarlo: el que exporta y publica es `desplegar.yml`, y sólo
#     en `main`. El job `carga-web` exporta sólo para medir. Comparte con `desplegar.yml` la
#     caché de la plantilla web optimizada, y no publica nada.
#   - No corre el editor. Los tests corren headless, que es lo que hace que la CI y la máquina
#     de cualquiera del equipo hagan exactamente lo mismo.
name: verify

on:
  pull_request:
  # Las DOS ramas: `staging` es donde aterriza el trabajo —el push que de verdad hay que
  # verificar— y `main` es lo que se entrega, así que no puede ser la única sin corrida propia.
  push:
    branches: [staging, main]

# Sólo leer el código: desde que el gate del mapa se fue, ningún nodo consulta la API. El
# default del repo es `read` a secas, así que todo permiso hay que declararlo igual.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-particion:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - particion: 0
            nombre: Colisiones y caídas
          - particion: 1
            nombre: Agarre y jornada
          - particion: 2
            nombre: Cajas, apoyos y giro
          - particion: 3
            nombre: Reposición, puertas y checks
    steps:
      - uses: actions/checkout@v5

      # La versión vive UNA vez, y ese lugar es `.godot-version`. Antes vivía en un `env:` de
      # acá y otra vez en la guía de inicio, con el encabezado diciendo «una vez» tres líneas
      # más arriba de la segunda copia. Con dos workflows que bajan Godot, dos copias que se
      # separan hacen que la CI verifique con un motor y el despliegue exporte con otro — y eso
      # no da rojo en ningún lado: las dos corridas salen verdes, cada una con el suyo.
      #
      # El `set -euo pipefail` y el `-z` no son ceremonia: con un `echo` pelado, si el archivo
      # falta, `tr` falla, el `echo` escribe igual una versión vacía y ESTE paso sale VERDE. El
      # rojo aparecería tres pasos después como un 404 de `curl` sobre una URL sin versión
      # adentro, que no nombra ni al archivo ni a quien lo borró.
      #
      # `tr -d` porque el archivo termina en salto de línea y el nombre de la release no.
      - name: La versión del motor, leída de `.godot-version`
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          if [ -z "$version" ]; then
            echo '::error::falta .godot-version o está vacío: es el único lugar donde vive la versión del motor y los dos workflows la leen de ahí.'
            exit 1
          fi
          echo "GODOT_VERSION=$version" >> "$GITHUB_ENV"

      # Versión EXACTA y no `3.x`: `3.x` resuelve a la última del día y convierte al runtime de
      # todas las herramientas en un blanco móvil — el mismo commit puede dar verde hoy y rojo
      # el mes que viene sin que nadie toque una línea.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # El harness no tiene dependencias: esto es el linter del JUEGO, no de las herramientas.
      - run: pip install "gdtoolkit==4.*"

      # Godot se baja acá y no se cachea entre corridas: es un zip de ~78 MB —77.860.424 bytes
      # el de 4.7.2, medido el 2026-09-06 contra la release de GitHub— y bajarlo tarda menos
      # que el paso de restaurar caché que habría que mantener. El nombre del ejecutable
      # sale del zip y por eso se resuelve con un glob: pinearlo a mano lo rompería en el
      # próximo bump de versión, y lo rompería con un "no such file" que no dice nada.
      - name: Bajar Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          bin="$(find "$HOME/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      # Ningún nodo sale a la red: el gate que consultaba GitHub se fue con el mapa de specs.
      - name: verificar
        run: >-
          python .claude/scripts/verificar.py
          --particion-tests ${{ matrix.particion }}/${{ strategy.job-total }}

      # Los reportes de gdUnit4, para poder mirar QUÉ falló sin reproducir la corrida. `always()`
      # porque el caso en que sirven es justamente aquel en que el paso anterior falló.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-gdunit4-${{ matrix.particion }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # Frena un PR que suma programas de shader a la carga web o agranda el motor: lo que ganaron
  # #514 y #523. Cuenta, no cronometra: la CI no tiene GPU, y el conteo depende de los
  # materiales del juego y no de la GPU. Los topes y cómo se sube uno: docs/guides/rendimiento.md.
  carga-web:
    name: Carga web
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: La versión del motor, leída de `.godot-version`
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          if [ -z "$version" ]; then
            echo '::error::falta .godot-version o está vacío: es el único lugar donde vive la versión del motor y los dos workflows la leen de ahí.'
            exit 1
          fi
          echo "GODOT_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bajar Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          bin="$(find "$HOME/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

      # Las dos cachés, con las mismas claves que `desplegar.yml`: la plantilla de un parche se
      # compila una vez para los dos workflows.
      - name: Caché de la plantilla web optimizada
        id: plantilla
        uses: actions/cache@v4
        with:
          path: build/templates
          key: web-optimizada-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('.godot-version', '.github/patches/godot-web-compilacion.json', '.github/patches/godot-web-compilacion.patch', '.github/scripts/preparar_plantilla_web.py') }}

      - name: Caché de los objetos del motor
        if: steps.plantilla.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/godot-web/cache-de-scons
          key: objetos-web-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/patches/godot-web-compilacion.json', '.github/patches/godot-web-compilacion.patch') }}
          restore-keys: objetos-web-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Preparar y validar la plantilla web
        run: python .github/scripts/preparar_plantilla_web.py --jobs 2

      - name: Importar los recursos del proyecto
        run: "$GODOT_BIN --headless --path . --import || true"

      # El código de salida del export no significa nada: decide el paso siguiente. El porqué
      # está en el encabezado de `desplegar.yml`.
      - name: Exportar la web
        run: |
          set -euo pipefail
          mkdir -p export/web
          "$GODOT_BIN" --headless --path . --export-release "Web" export/web/index.html || true

      - name: El veredicto del export
        run: python .claude/scripts/verificar_export.py export/web

      - name: El export usa la plantilla optimizada
        run: python .github/scripts/preparar_plantilla_web.py --verificar-export export/web

      # Las dos mediciones van en el mismo paso que el servidor: el `trap` lo cierra también
      # cuando una medición falla o vence su plazo.
      - name: Contar los programas de la carga, con y sin enlace en paralelo
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chrome
          mkdir -p reports/carga-web
          python .github/scripts/servir_export.py export/web 8060 > reports/carga-web/servidor.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" 2>/dev/null || true' EXIT
          for intento in $(seq 30); do
            curl -fs -o /dev/null http://localhost:8060/index.html && break
            sleep 1
          done
          node .github/scripts/medir_la_carga.mjs http://localhost:8060             reports/carga-web/con-paralelo.json --sin-ventana --software
          node .github/scripts/medir_la_carga.mjs http://localhost:8060             reports/carga-web/sin-paralelo.json --sin-ventana --software --sin-enlace-en-paralelo

      - name: Los topes de la carga
        run: >-
          python .github/scripts/tope_de_carga.py .github/performance/topes-de-carga.json
          reports/carga-web/con-paralelo.json reports/carga-web/sin-paralelo.json
          export/web/index.wasm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carga-web
          path: reports/carga-web/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [verify-particion, carga-web]
    runs-on: ubuntu-latest
    steps:
      - name: Todas las particiones y la carga web deben pasar
        env:
          PARTICIONES: ${{ needs.verify-particion.result }}
          CARGA_WEB: ${{ needs.carga-web.result }}
        run: test "$PARTICIONES" = success && test "$CARGA_WEB" = success

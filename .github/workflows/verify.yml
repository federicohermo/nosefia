name: verify

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    uses: ./.github/workflows/preparar-godot-nativo.yml

  verify-particion:
    name: Partición ${{ matrix.particion }}
    needs: motor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        particion: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.motor.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/motor-nativo
      - name: Validar motor nativo de esta corrida
        env:
          RECETA_ESPERADA: ${{ needs.motor.outputs.receta }}
        run: |
          set -euo pipefail
          mkdir -p build/godot-native/linux-x86_64
          tar --zstd -xf "$RUNNER_TEMP/motor-nativo/godot-nativo.tar.zst" -C build/godot-native/linux-x86_64
          python .github/scripts/preparar_godot_nativo.py comprobar \
            --plataforma linux-x86_64 --destino build/godot-native/linux-x86_64 \
            > "$RUNNER_TEMP/motor-nativo.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          datos = json.loads((Path(os.environ['RUNNER_TEMP']) / 'motor-nativo.json').read_text())
          if datos['receta_sha256'] != os.environ['RECETA_ESPERADA']:
              raise ValueError('el motor descargado no coincide con la receta del productor')
          with open(os.environ['GITHUB_ENV'], 'a') as salida:
              salida.write(f"GODOT_BIN={datos['binario']}\n")
              salida.write(f"GODOT_NATIVE_RECIPE={datos['receta_sha256']}\n")
          PY

      - name: Identidad de las importaciones actuales
        id: importaciones
        run: python .github/scripts/cache_importaciones.py identidad

      - name: Restaurar importaciones compatibles
        id: restaurar-importaciones
        if: steps.importaciones.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: ${{ steps.importaciones.outputs.key }}

      - name: Preparar importaciones para la verificación actual
        env:
          CACHE_HIT: ${{ steps.restaurar-importaciones.outputs.cache-hit }}
          CACHE_RESULTADO: ${{ steps.restaurar-importaciones.outcome }}
          CACHE_CLAVE_RESTAURADA: ${{ steps.restaurar-importaciones.outputs.cache-matched-key }}
        run: python .github/scripts/cache_importaciones.py preparar

      - run: pip install "gdtoolkit==4.*"

      - name: verificar
        run: >-
          python .claude/scripts/verificar.py
          --particion-tests ${{ matrix.particion }}/${{ strategy.job-total }}

      - name: Registrar recursos derivados actuales
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          git ls-files -z 'assets/models/*.res' | xargs -0 -r sha256sum > reports/cache-recursos.sha256

      - name: Guardar importaciones para próximas revisiones
        if: >-
          success() && matrix.particion == 0 &&
          steps.importaciones.outputs.cacheable == 'true' &&
          steps.restaurar-importaciones.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.importaciones.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-gdunit4-${{ matrix.particion }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [motor, verify-particion]
    runs-on: ubuntu-latest
    steps:
      - name: Todas las particiones deben pasar
        env:
          MOTOR: ${{ needs.motor.result }}
          RESULTADO: ${{ needs.verify-particion.result }}
        run: |
          test "$MOTOR" = success
          test "$RESULTADO" = success

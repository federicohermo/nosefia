name: medir-verificacion
run-name: Medir ${{ inputs.particiones || '4' }} ${{ inputs.preparacion || 'independiente' }} ${{ inputs.etiqueta || 'registro' }}

on:
  workflow_dispatch:
    inputs:
      particiones:
        description: Cantidad de particiones
        default: '4'
        required: true
      preparacion:
        description: Preparación de herramientas e importación
        type: choice
        options: [independiente, compartida, importaciones]
        default: independiente
        required: true
      etiqueta:
        description: Identificador de repetición
        default: manual
        required: true

permissions:
  contents: read

env:
  PARTICIONES: ${{ inputs.particiones || '4' }}
  PREPARACION: ${{ inputs.preparacion || 'independiente' }}
  TIPO_SNAPSHOT: ${{ inputs.preparacion == 'importaciones' && 'importaciones' || 'completo' }}
  ETIQUETA: ${{ inputs.etiqueta || 'registro' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.plan.outputs.matriz }}
    steps:
      - id: plan
        run: |
          python - <<'PY'
          import json, os
          n = int(os.environ['PARTICIONES'])
          if not 1 <= n <= 256:
              raise ValueError('particiones debe estar entre 1 y 256')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as salida:
              salida.write('matriz=' + json.dumps({'indice': list(range(n))}) + '\n')
          PY

  preparar:
    needs: plan
    if: inputs.preparacion == 'compartida' || inputs.preparacion == 'importaciones'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar herramientas
        run: |
          set -euo pipefail
          if [ "$PREPARACION" = compartida ]; then
            python -m venv .ci-tools/python
            .ci-tools/python/bin/pip install 'gdtoolkit==4.*'
          else
            mkdir -p .ci-tools
          fi
          touch .ci-tools/.gdignore
          version="$(tr -d '[:space:]' < .godot-version)"
          test -n "$version"
          mkdir -p .ci-tools/godot
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .ci-tools/godot
          bin="$(find "$GITHUB_WORKSPACE/.ci-tools/godot" -type f -name 'Godot_v*' | head -1)"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - name: Importar una vez
        run: python .github/scripts/medir_verificacion.py preparar --tipo "$TIPO_SNAPSHOT"
      - name: Empaquetar preservando fechas y permisos
        run: python .github/scripts/medir_verificacion.py empaquetar "$RUNNER_TEMP/snapshot.tar.zst" --tipo "$TIPO_SNAPSHOT"
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-preparado
          path: ${{ runner.temp }}/snapshot.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicion-preparacion
          path: reports/medicion-ci/
          retention-days: 1
          if-no-files-found: warn

  worker:
    name: worker-${{ matrix.indice }}
    needs: [plan, preparar]
    if: always() && needs.plan.result == 'success' && (needs.preparar.result == 'success' || needs.preparar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v5
        if: env.PREPARACION != 'compartida'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar herramientas independientes
        if: env.PREPARACION != 'compartida'
        run: |
          set -euo pipefail
          pip install 'gdtoolkit==4.*'
          version="$(tr -d '[:space:]' < .godot-version)"
          test -n "$version"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          bin="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*' | head -1)"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: env.PREPARACION != 'independiente'
        with:
          name: snapshot-preparado
          path: ${{ runner.temp }}/snapshot
      - name: Restaurar copia privada de la preparación
        if: env.PREPARACION != 'independiente'
        run: |
          set -euo pipefail
          tar --zstd -xf "$RUNNER_TEMP/snapshot/snapshot.tar.zst" -C "$GITHUB_WORKSPACE"
          if [ "$PREPARACION" = compartida ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          python .github/scripts/medir_verificacion.py validar-snapshot --tipo "$TIPO_SNAPSHOT"
          if [ "$PREPARACION" = compartida ]; then
            echo "$GITHUB_WORKSPACE/.ci-tools/python/bin" >> "$GITHUB_PATH"
            bin="$(find "$GITHUB_WORKSPACE/.ci-tools/godot" -type f -name 'Godot_v*' | head -1)"
            echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          fi
      - name: Medir verificación
        env:
          INDICE: ${{ matrix.indice }}
        run: |
          python_bin=python
          if [ "$PREPARACION" = compartida ]; then
            python_bin=.ci-tools/python/bin/python
          fi
          "$python_bin" .github/scripts/medir_verificacion.py verificar "$INDICE" "$PARTICIONES" "$PREPARACION" "$ETIQUETA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicion-worker-${{ matrix.indice }}
          path: reports/
          retention-days: 1
          if-no-files-found: warn

  resultado:
    needs: [plan, preparar, worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          PREPARAR: ${{ needs.preparar.result }}
          WORKERS: ${{ needs.worker.result }}
        run: |
          test "$PLAN" = success
          test "$PREPARAR" = success -o "$PREPARAR" = skipped
          test "$WORKERS" = success

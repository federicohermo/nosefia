<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No se fía · Three.js (empaquetado)</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
#datos { position: fixed; left: 8px; top: 8px; padding: 6px 10px; font: 12px/1.5 ui-monospace, monospace; color: #cfe; background: rgba(0,0,0,.55); border-radius: 6px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="datos">cargando</div>
<script>
const mostrar = (m) => { document.getElementById('datos').textContent = 'ERROR
' + m; };
addEventListener('error', (e) => mostrar(e.message));
addEventListener('unhandledrejection', (e) => mostrar(String(e.reason && e.reason.stack || e.reason)));
</script>
<script type="module" src="/three/dist/visor.js"></script>
</body>
</html>
